- uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHOW_PROJECTS: "True"    # <--- This is the magic line!
          SHOW_EDITORS: "True"     # <--- Shows VS Code vs others
          SHOW_TIMEZONE: "True"
          SHOW_COMMIT: "True"
